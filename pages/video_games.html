<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- meta information -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Thomas Mairella">
        <meta name="description" content="A Video Game page for an CrediblePick.">
        <title>Video Games - CrediblePick</title>
        <link rel="stylesheet" href="../css/style.css">
        <link rel="icon" type="image/svg+xml" href="../images/icon.svg">
    </head>
    <body>
        <!-- header for page -->
        <header>
            <h1><a href="../index.html" class="home">CrediblePick</a></h1>
            <nav>
                <a href="../pages/movies.html" class="navigation">Movies</a>
                <a href="../pages/tv_shows.html" class="navigation">TV Shows</a>
                <a href="../pages/video_games.html" class="navigation">Video Games</a>
            </nav>
            <hr>
        </header>

        <!-- main page content -->
        <main class="vgpage">
            <figure class="videogame">
                <img src="../images/minecraft.jpg" alt="minecraft poster">
                <figcaption>
                    <span class="title">Minecraft (2009)</span>
                    <span class="rating">8/10</span>
                    <span class="review-description">A good open sandbox game where you can build in and explore worlds. I love building so this is great, but it also includes much more so it's a good fit for all.</span>
                </figcaption>
            </figure>
            <figure class="videogame">
                <img src="../images/tlou.jpg" alt="the last of us poster">
                <figcaption>
                    <span class="title">The Last of Us (2013)</span>
                    <span class="rating">9/10</span>
                    <span class="review-description">A fun adventure with good characters and story as well as good mechanics making it a great zombie game.</span>
                </figcaption>
            </figure>
            <figure class="videogame">
                <img src="../images/undertale.png" alt="undertale poster">
                <figcaption>
                    <span class="title">Undertale (2015)</span>
                    <span class="rating">10/10</span>
                    <span class="review-description">No need to explain other than.. absolute cinema..</span>
                </figcaption>
            </figure>
        </main>

        <!-- footer for page -->
        <footer>
            <hr>
            <p class="copyright">Created by Thomas Mairella. &copy; 2026 All Rights Reserved.</p>
        </footer>
    </body>
</html>
