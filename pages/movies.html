<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- meta information -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Thomas Mairella">
        <meta name="description" content="A movie page for an CrediblePick.">
        <title>Movies - CrediblePick</title>
        <link rel="stylesheet" href="../css/style.css">
        <link rel="icon" type="image/svg+xml" href="../images/icon.svg">
    </head>
    <body>
        <!-- header for page -->
        <header>
            <h1><a href="../index.html" class="home">CrediblePick</a></h1>
            <nav>
                <a href="../pages/movies.html" class="navigation">Movies</a>
                <a href="../pages/tv_shows.html" class="navigation">TV Shows</a>
                <a href="../pages/video_games.html" class="navigation">Video Games</a>
            </nav>
            <hr>
        </header>

        <!-- main page content -->
        <main class="moviepage">
            <figure class="movie">
                <img src="../images/bttf.jpg" alt="back to the future poster">
                <figcaption>
                    <span class="title">Back to the Future (1985)</span>
                    <span class="rating">9/10</span>
                    <span class="review-description">This is a really great movie with such a good plot and characters. I'd watch this over and over again its a favorite of mine.</span>
                </figcaption>
            </figure>
            <figure class="movie">
                <img src="../images/httyd.jpg" alt="how to train your dragon poster">
                <figcaption>
                    <span class="title">How to Train Your Dragon (2010)</span>
                    <span class="rating">8.5/10</span>
                    <span class="review-description">This is a really great kids film and I still rewatch it to this day. It has a great plot and characters.</span>
                </figcaption>
            </figure>
            <figure class="movie">
                <img src="../images/lms.jpg" alt="little miss sunshine poster">
                <figcaption>
                    <span class="title">Little Miss Sunshine (2006)</span>
                    <span class="rating">8/10</span>
                    <span class="review-description">A great coming of age story for all ages. It has a great story and characters you can relate to in some way. It's so bitter sweet.</span>
                </figcaption>
            </figure>
        </main>

        <!-- footer for page -->
        <footer>
            <hr>
            <p class="copyright">Created by Thomas Mairella. &copy; 2026 All Rights Reserved.</p>
        </footer>
    </body>
</html>
