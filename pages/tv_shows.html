<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- meta information -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Thomas Mairella">
        <meta name="description" content="A TV page for an CrediblePick.">
        <title>TV Shows - CrediblePick</title>
        <link rel="stylesheet" href="../css/style.css">
        <link rel="icon" type="image/svg+xml" href="../images/icon.svg">
    </head>
    <body>
        <!-- header for page -->
        <header>
            <h1><a href="../index.html" class="home">CrediblePick</a></h1>
            <nav>
                <a href="../pages/movies.html" class="navigation">Movies</a>
                <a href="../pages/tv_shows.html" class="navigation">TV Shows</a>
                <a href="../pages/video_games.html" class="navigation">Video Games</a>
            </nav>
            <hr>
        </header>

        <!-- main page content -->
        <main class="tvpage">
            <figure class="tvshow">
                <img src="../images/sm.jpg" alt="smiling friends poster">
                <figcaption>
                    <span class="title">Smiling Friends (2022)</span>
                    <span class="rating">9/10</span>
                    <span class="review-description">A funny cartoon that is always just random stuff going on, yet it's such a good show. I love the characters and plots of some episodes too.</span>
                </figcaption>
            </figure>
            <figure class="tvshow">
                <img src="../images/spongebob.jpg" alt="spongebob squarepants poster">
                <figcaption>
                    <span class="title">Spongebob Squarepants (1999)</span>
                    <span class="rating">8/10</span>
                    <span class="review-description">A really good kids show that has such a good vibe, especially during the earlier seasons. Can't really hate on the show it's just good.</span>
                </figcaption>
            </figure>
            <figure class="tvshow">
                <img src="../images/ij.jpg" alt="impractical jokers poster">
                <figcaption>
                    <span class="title">Impractical Jokers (2011)</span>
                    <span class="rating">8/10</span>
                    <span class="review-description">A really funny tv show wherew friends put each other into really funny situations. This is fun for a group of friends or family just to get a good laugh and i've loved it for so long.</span>
                </figcaption>
            </figure>
        </main>

        <!-- footer for page -->
        <footer>
            <hr>

        </footer>
    </body>
